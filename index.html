<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
    <style>
        /* Configurações gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* Caixa principal */
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }
        /* Título */
        h1 {
            text-align: center;
            margin-bottom: 25px;
        }
        /* Área do input */
        .adicionar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        /* Campo de texto */
        #tarefaInput {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #2b2b2b;
            color: white;
            outline: none;
        }
        /* Botão adicionar */
        #btnAdicionar {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #4f46e5;
            color: white;
            cursor: pointer;
        }
        #btnAdicionar:hover {
            background-color: #4338ca;
        }
        /* Lista */
        #listaTarefas {
            list-style: none;
        }
        /* Cada tarefa */
        .tarefa {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #292929;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        /* Texto */
        .texto-tarefa {
            flex: 1;
            margin-left: 10px;
            word-break: break-word;
        }
        /* Tarefa concluída */
        .concluida .texto-tarefa {
            text-decoration: line-through;
            color: #888;
        }
        /* Botões */
        .botoes {
            display: flex;
            gap: 8px;
        }
        .btn-concluir,
        .btn-excluir {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
        .btn-concluir {
            background-color: #16a34a;
        }
        .btn-excluir {
            background-color: #dc2626;
        }
        /* Responsividade */
        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }
            .adicionar {
                flex-direction: column;
            }
            #btnAdicionar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Minha Lista</h1>
        <!-- Campo para adicionar tarefas -->
        <div class="adicionar">
            <input
                type="text"
                id="tarefaInput"
                placeholder="Digite uma tarefa..."
            >
            <button id="btnAdicionar">
                Adicionar
            </button>
        </div>
        <!-- Lista onde as tarefas aparecem -->
        <ul id="listaTarefas"></ul>
    </div>
    <script>
        // Pegando os elementos do HTML
        const tarefaInput = document.getElementById("tarefaInput");
        const btnAdicionar = document.getElementById("btnAdicionar");
        const listaTarefas = document.getElementById("listaTarefas");
        /*
            Pegamos as tarefas que já estão salvas
            no localStorage.
            Se não existir nenhuma tarefa salva,
            usamos um array vazio.
        */
        let tarefas = JSON.parse(localStorage.getItem("tarefas")) || [];
        // Salva o array de tarefas no navegador
        function salvarTarefas() {
            localStorage.setItem(
                "tarefas",
                JSON.stringify(tarefas)
            );
        }
        // Mostra as tarefas na tela
        function mostrarTarefas() {
            // Limpa a lista antes de mostrar novamente
            listaTarefas.innerHTML = "";
            // Percorre todas as tarefas salvas
            tarefas.forEach(function (tarefa, index) {
                // Cria o item da lista
                const li = document.createElement("li");
                li.classList.add("tarefa");
                // Se a tarefa estiver concluída,
                // adiciona a classe "concluida"
                if (tarefa.concluida) {
                    li.classList.add("concluida");
                }
                // Cria o texto
                const span = document.createElement("span");
                span.classList.add("texto-tarefa");
                span.textContent = tarefa.texto;
                // Cria a área dos botões
                const botoes = document.createElement("div");
                botoes.classList.add("botoes");
                // Botão concluir
                const btnConcluir = document.createElement("button");
                btnConcluir.classList.add("btn-concluir");
                btnConcluir.textContent = "✓";
                // Ao clicar, altera o estado da tarefa
                btnConcluir.addEventListener("click", function () {
                    tarefa.concluida = !tarefa.concluida;
                    // Salva a alteração
                    salvarTarefas();
                    // Atualiza a tela
                    mostrarTarefas();
                });
                // Botão excluir
                const btnExcluir = document.createElement("button");
                btnExcluir.classList.add("btn-excluir");
                btnExcluir.textContent = "✕";
                // Ao clicar, remove a tarefa
                btnExcluir.addEventListener("click", function () {
                    tarefas.splice(index, 1);
                    // Salva a nova lista
                    salvarTarefas();
                    // Atualiza a tela
                    mostrarTarefas();
                });
                // Adiciona os botões
                botoes.appendChild(btnConcluir);
                botoes.appendChild(btnExcluir);
                // Adiciona texto e botões na tarefa
                li.appendChild(span);
                li.appendChild(botoes);
                // Adiciona a tarefa na lista
                listaTarefas.appendChild(li);
            });
        }
        // Função para adicionar uma tarefa
        function adicionarTarefa() {
            // Pega o texto digitado
            const texto = tarefaInput.value.trim();
            // Não permite tarefa vazia
            if (texto === "") {
                alert("Digite uma tarefa!");
                return;
            }
            // Cria um novo objeto de tarefa
            const novaTarefa = {
                texto: texto,
                concluida: false
            };
            // Adiciona a tarefa no array
            tarefas.push(novaTarefa);
            // Salva no localStorage
            salvarTarefas();
            // Atualiza a lista na tela
            mostrarTarefas();
            // Limpa o input
            tarefaInput.value = "";
            // Volta o cursor para o input
            tarefaInput.focus();
        }
        // Botão adicionar
        btnAdicionar.addEventListener(
            "click",
            adicionarTarefa
        );
        // Permite adicionar apertando Enter
        tarefaInput.addEventListener(
            "keypress",
            function (event) {
                if (event.key === "Enter") {
                    adicionarTarefa();
                }
            }
        );
        /*
            Quando a página abre,
            carrega as tarefas que estavam salvas.
        */
        mostrarTarefas();
    </script>
</body>
</html>
